<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무한 실험체 비연아</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<!-- ══════════════════════════════════════════════════════════════

     ══════════════════════════════════════════════════════════════ -->
<script>
const 설정 = {

  /* ── 이미지 ── 파일 경로나 인터넷 주소를 넣으세요. 비워두면 빈 자리로 표시됩니다. */
  이미지: {
    표지:     "mm/e.gif",   // 첫 화면 배경 (세로로 긴 이미지 권장)
    인물:     "mm/b.gif",   // 비연아 소개용 인물 이미지

  },

  /* ── 배경음악 ── mp3 파일 경로. 비워두면 음악 버튼이 사라집니다. */
  음악: "mm/옥비늘 저편.mp3",

  /* ── 입장 화면 ── 꽃잎을 누르면 들어갑니다.
     찻잔·꽃잎 이미지를 비워두면 기본 그림이 나옵니다.
     · 찻잔 이미지 : 600 × 600 px  (배경 투명 PNG, 위에서 내려다본 모습)
     · 꽃잎 이미지 : 200 × 200 px  (배경 투명 PNG, 꽃잎이 가운데 오도록)
     크기 숫자는 화면에 보이는 폭(px)입니다. 취향껏 바꾸세요. */
  입장: {
    한자:   "無限實驗體",
    안내:   "찻잔에 떨어진 꽃잎을 누르세요",
    찻잔:   "mm/ee.png",
    꽃잎:   "mm/ww.png",
    잔크기: 300,
    잎크기: 76,
  },

  /* ── 첫 화면 ── */
  표지: {
    한자:   "無限實驗體",
    이름:   "비연아",
    한줄:   "어떤 독으로도 죽지 않는 몸에게, 오늘도 새 약을 먹인다.",
    꼬리표: "무한하게, 무한하게.",
  },

  /* ── 의뢰서 ── */
  의뢰: {
    제목: "조정의 의뢰",
    본문: [
      "흑랑산맥에 흉아캐용이 산다. 검은 비늘은 창칼을 튕겨내고, 관군이 쏟아부은 모든 독을 삼키고도 살아남았다. 지나간 자리에는 마른 짐승 사체와 썩은 냄새만 남는다.",
      "물리로도 화력으로도 죽인 기록이 없다. 남은 가설은 하나뿐이다. 그것조차 죽이는 독.",
      "조정은 현상금을 걸었고, 아무도 받지 않은 그 의뢰가 당신의 공방에 도착했다. 그리고 그 실험에 쓰라며, 죽지 않는 몸 하나가 함께 왔다.",
    ],
    인장: "勅",
  },

  /* ── 비연아 소개 ── */
  인물: {
    이름:   "비연아",
    한자:   "緋燕兒",
    직함:   "불사의 실험체",
    항목: [
      ["나이",  "스물둘"],
      ["신분",  "만독문의 마지막 실험체"],
      ["특징",  "어떤 독도 그녀를 죽이지 못한다"],
      ["말투",  "존댓말. 초반에는 보고하듯 건조하다"],
    ],
    본문: "베인 자리도 데인 자리도 하루면 사라진다. 실험을 수백 번 겪은 몸이라고는 믿기지 않을 만큼 깨끗한 팔. 다만 죽지 않는다는 것이 아프지 않다는 뜻은 아니어서, 그녀는 매번 온전히 겪고 온전히 돌아온다. 그리고 그것을 비극처럼 말하지 않는다.",
    대사: [
      "저는 시험용으로 딸려 왔습니다. 뭘 먹여도 죽지 않아요.",
      "몇 초였어요? …아, 세고 계셨죠. 그럼 적으세요.",
      "이거, 드릴게요. 주워 왔으니까. 필요 없으면 버리셔도 되고요.",
    ],
  },

  /* ── 실험 루프 ── 단계를 늘리거나 줄여도 됩니다. */
  실험: {
    제목: "실험",
    설명: "약은 독만 나오지 않는다. 재료의 성질이 몸속에서 결합해 예상 밖의 것이 발현하고, 그 부작용이 그대로 다음 원정의 능력이 된다.",
    단계: [
      ["조제", "기재와 촉매와 안정재. 배합비와 공정은 당신이 정한다."],
      ["투여", "발현 시간, 증상, 지속, 회복. 이 네 가지가 데이터의 전부다."],
      ["관찰", "야시, 경량화, 발광, 수면불요. 노린 것이 나오는 일은 드물다."],
      ["파견", "약효가 남아 있는 동안 그녀를 내보낸다. 돌아오는 꼴이 곧 결과다."],
      ["개량", "같은 계열을 반복하면 데이터가 굳는다. 미지의 것에 값이 붙는다."],
    ],
  },

  /* ── 위험지대 ── */
  지대: {
    제목: "지대",
    설명: "약효 없이는 들어갈 수 없다.",
    목록: [
      ["1", "야산",     "약초와 벌레. 아무 약도 필요 없다."],
      ["2", "연택 습지", "독무와 희귀균. 폐를 지킬 것이 필요하다."],
      ["3", "폐광",     "빛이 들지 않는다. 어둠을 볼 수 있어야 한다."],
      ["4", "흑랑산맥",  "흉아캐용의 영역. 극상 재료가 여기 있다."],
      ["5", "만독곡",   "멸문한 독문의 폐허. 금역."],
    ],
  },

  /* ── 프롤로그 발췌 ── */
  프롤로그: {
    제목: "프롤로그",
    지문: "경신년 사월, 화안에 사흘째 비가 내린다. 약재 서랍이 벽을 메운 공방 안, 눅눅한 약초 냄새 사이로 문 두드리는 소리가 났다.",
    대사: "비연아입니다. 오늘부터 여기서 지내라고 들었어요.",
    끝맺음: "인사도 표정도 없다. 그녀는 젖은 소매에서 접힌 문서 한 장을 꺼내 탁자에 올려놓았다. 조정의 붉은 인장.",
  },

  /* ── 마지막 ── 버튼 주소를 넣으세요. */
  시작: {
    문구:   "다음 건 언제 나옵니까.",
    버튼:   "크랙에서 시작하기",
    주소:   "https://share.crack.wrtn.ai/47k11x",
  },
};
</script>

<style>
:root{
  --먹:      #0d0a0a;
  --먹연함:  #171212;
  --담묵:    #241d1b;
  --한지:    #e6dccb;
  --한지흐림:#9c9083;
  --주사:    #b0201c;
  --주사밝음:#d8332c;
  --금:      #b18f3f;
  --선:      rgba(230,220,203,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--먹);
  color:var(--한지);
  font-family:'Gowun Batang',serif;
  line-height:1.9;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(176,32,28,.10), transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(177,143,63,.07), transparent 55%);
}
::selection{background:var(--주사);color:var(--한지)}

/* ── 공통 ── */
.벽{max-width:1120px;margin:0 auto;padding:0 clamp(24px,5vw,56px)}
section{position:relative;z-index:2;padding:clamp(90px,13vh,150px) 0}
.제목{
  font-family:'Nanum Myeongjo',serif;font-weight:800;
  font-size:clamp(30px,4.6vw,52px);letter-spacing:.14em;line-height:1.3;
}
.눈썹{
  font-family:'Noto Sans KR',sans-serif;font-weight:300;
  font-size:11px;letter-spacing:.55em;color:var(--주사밝음);
  text-transform:uppercase;margin-bottom:20px;display:block;
}
.본문{font-size:clamp(15px,1.6vw,17px);color:#cfc4b3;max-width:62ch}
.본문+.본문{margin-top:1.15em}

/* 등장 */
.등장{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s cubic-bezier(.16,1,.3,1)}
.등장.보임{opacity:1;transform:none}

/* ── 이미지 자리 ── */
.그림{position:relative;overflow:hidden;background:var(--담묵);border:1px solid var(--선)}
.그림 img{width:100%;height:100%;object-fit:cover;display:block}
.빈자리{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:'Noto Sans KR',sans-serif;font-size:11px;letter-spacing:.4em;
  color:rgba(230,220,203,.22);
  background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(230,220,203,.028) 14px 28px);
}

/* ── 표지 ── */
#표지{
  min-height:100svh;display:grid;grid-template-columns:1fr 1fr;
  align-items:center;gap:clamp(30px,6vw,80px);
  padding:0 clamp(24px,5vw,72px);
}
#표지 .글{position:relative;z-index:3;padding:80px 0}
.한자기둥{
  writing-mode:vertical-rl;font-family:'Nanum Myeongjo',serif;font-weight:800;
  font-size:clamp(40px,6.5vw,80px);letter-spacing:.22em;
  color:var(--한지);line-height:1;margin-bottom:34px;
  text-shadow:0 0 60px rgba(176,32,28,.35);
}
.이름크게{
  font-family:'Nanum Myeongjo',serif;font-weight:800;
  font-size:clamp(46px,8vw,96px);letter-spacing:.1em;line-height:1.05;
  margin-bottom:26px;
}
.이름크게 span{color:var(--주사밝음)}
.한줄{font-size:clamp(15px,1.7vw,18px);color:#c6bba9;max-width:34ch;margin-bottom:32px}
.꼬리표{
  display:inline-block;font-family:'Noto Sans KR',sans-serif;font-weight:300;
  font-size:11px;letter-spacing:.4em;color:var(--한지흐림);
  border:1px solid var(--선);padding:9px 18px;
}
#표지 .그림{height:min(88svh,860px);align-self:center}
#표지 .그림::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to right,var(--먹) 0%,transparent 32%,transparent 100%);
}

/* 인장 */
.인장{
  position:absolute;top:clamp(40px,8vh,90px);right:clamp(24px,6vw,80px);z-index:5;
  width:88px;height:88px;display:grid;place-items:center;
  border:2.5px solid var(--주사);border-radius:4px;
  color:var(--주사);font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:34px;
  letter-spacing:0;opacity:0;transform:rotate(-11deg) scale(1.7);
  animation:도장 .8s cubic-bezier(.16,1,.3,1) 1.1s forwards;
}
@keyframes 도장{to{opacity:.9;transform:rotate(-11deg) scale(1)}}

/* 스크롤 힌트 */
.내려가기{
  position:absolute;bottom:34px;left:clamp(24px,5vw,72px);z-index:4;
  font-family:'Noto Sans KR',sans-serif;font-size:10px;letter-spacing:.4em;
  color:var(--한지흐림);display:flex;align-items:center;gap:12px;
}
.내려가기::after{content:'';width:52px;height:1px;background:var(--한지흐림);animation:늘어남 2.4s ease-in-out infinite}
@keyframes 늘어남{0%,100%{transform:scaleX(.4);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}}

/* ── 의뢰서 ── */
#의뢰{background:var(--먹연함);border-top:1px solid var(--선);border-bottom:1px solid var(--선)}
.문서{
  position:relative;border:1px solid var(--선);padding:clamp(34px,5vw,64px);
  background:linear-gradient(180deg,rgba(230,220,203,.035),transparent);
}
.문서::before{
  content:'';position:absolute;top:-1px;left:-1px;width:38px;height:38px;
  border-top:2px solid var(--주사);border-left:2px solid var(--주사);
}
.문서::after{
  content:'';position:absolute;bottom:-1px;right:-1px;width:38px;height:38px;
  border-bottom:2px solid var(--주사);border-right:2px solid var(--주사);
}
.문서 .제목{margin-bottom:30px}
.붉은인{
  position:absolute;right:clamp(28px,5vw,58px);bottom:clamp(28px,5vw,58px);
  width:64px;height:64px;display:grid;place-items:center;
  border:2px solid var(--주사);border-radius:3px;color:var(--주사);
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:26px;
  transform:rotate(7deg);opacity:.85;
}

/* ── 인물 ── */
.인물틀{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);gap:clamp(34px,5vw,72px);align-items:start}
.인물틀 .그림{aspect-ratio:3/4}
.이름줄{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.이름줄 .한자{font-family:'Nanum Myeongjo',serif;font-size:18px;color:var(--주사밝음);letter-spacing:.3em}
.직함{font-family:'Noto Sans KR',sans-serif;font-weight:300;font-size:12px;letter-spacing:.35em;color:var(--한지흐림);margin-bottom:30px}
.항목{border-top:1px solid var(--선);margin-bottom:30px}
.항목 .줄{display:grid;grid-template-columns:88px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--선);font-size:15px}
.항목 .키{font-family:'Noto Sans KR',sans-serif;font-weight:300;font-size:11px;letter-spacing:.3em;color:var(--한지흐림);padding-top:4px}
.대사모음{margin-top:32px;display:flex;flex-direction:column;gap:14px}
.대사{
  font-size:15px;color:#d5cabb;padding-left:20px;position:relative;font-style:italic;
}
.대사::before{content:'';position:absolute;left:0;top:.75em;width:9px;height:1px;background:var(--주사)}

/* ── 실험 ── */
#실험{background:var(--먹연함);border-top:1px solid var(--선);border-bottom:1px solid var(--선)}
.실험틀{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:clamp(34px,5vw,72px);align-items:start}
.실험틀 .그림{aspect-ratio:4/5}
.단계{border-top:1px solid var(--선);margin-top:34px}
.단계 .칸{
  display:grid;grid-template-columns:56px 1fr;gap:20px;
  padding:24px 0;border-bottom:1px solid var(--선);
  transition:padding-left .45s cubic-bezier(.16,1,.3,1);
}
.단계 .칸:hover{padding-left:14px}
.단계 .이름{
  font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:20px;
  letter-spacing:.1em;color:var(--한지);
  writing-mode:vertical-rl;height:fit-content;
}
.단계 .칸:hover .이름{color:var(--주사밝음)}
.단계 .설명{font-size:15px;color:#bcb0a0;padding-top:3px}

/* ── 지대 ── */
.지대줄{
  display:grid;grid-template-columns:52px 1fr;gap:22px;align-items:center;
  padding:22px 0;border-bottom:1px solid var(--선);
  transition:background .4s ease,padding-left .4s ease;
}
.지대줄:first-of-type{border-top:1px solid var(--선)}
.지대줄:hover{background:rgba(176,32,28,.06);padding-left:14px}
.급{
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:30px;
  color:var(--주사);text-align:center;line-height:1;
}
.급 small{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:300;font-size:9px;letter-spacing:.3em;color:var(--한지흐림);margin-top:5px}
.지대이름{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:19px;letter-spacing:.08em;margin-bottom:3px}
.지대설명{font-size:14px;color:var(--한지흐림)}

/* ── 프롤로그 ── */
#프롤로그{background:var(--먹연함);border-top:1px solid var(--선);border-bottom:1px solid var(--선)}
.프롤틀{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.62fr);gap:clamp(34px,5vw,72px);align-items:center}
.프롤틀 .그림{aspect-ratio:3/4}
.지문{font-size:16px;color:#c2b6a6;font-style:italic;max-width:52ch}
.대사크게{
  font-family:'Nanum Myeongjo',serif;font-weight:700;
  font-size:clamp(19px,2.4vw,27px);line-height:1.75;letter-spacing:.02em;
  margin:34px 0;padding-left:26px;border-left:2px solid var(--주사);
}

/* ── 시작 ── */
#시작{text-align:center;padding:clamp(110px,17vh,190px) 0}
.시작문구{
  font-family:'Nanum Myeongjo',serif;font-weight:700;
  font-size:clamp(26px,4.4vw,48px);letter-spacing:.08em;margin-bottom:44px;
}
.버튼{
  display:inline-block;font-family:'Noto Sans KR',sans-serif;font-weight:400;
  font-size:13px;letter-spacing:.36em;color:var(--한지);text-decoration:none;
  border:1px solid var(--주사);padding:19px 46px;position:relative;overflow:hidden;
  transition:color .45s ease;
}
.버튼 span{position:relative;z-index:2}
.버튼::before{
  content:'';position:absolute;inset:0;background:var(--주사);
  transform:scaleY(0);transform-origin:bottom;transition:transform .45s cubic-bezier(.16,1,.3,1);
}
.버튼:hover::before{transform:scaleY(1)}
.바닥{margin-top:70px;font-family:'Noto Sans KR',sans-serif;font-size:10px;letter-spacing:.35em;color:rgba(230,220,203,.24)}

/* ── 음악 ── */
#음악버튼{
  position:fixed;right:24px;bottom:24px;z-index:60;
  width:52px;height:52px;border-radius:50%;cursor:pointer;
  background:rgba(13,10,10,.86);border:1px solid var(--선);
  backdrop-filter:blur(8px);display:none;place-items:center;
  transition:border-color .35s ease,transform .35s ease;
}
#음악버튼:hover{border-color:var(--주사);transform:scale(1.07)}
#음악버튼 .막대{display:flex;align-items:flex-end;gap:3px;height:17px}
#음악버튼 .막대 i{width:2px;background:var(--한지흐림);height:5px;transition:background .3s}
#음악버튼.켜짐 .막대 i{background:var(--주사밝음);animation:출렁 1s ease-in-out infinite}
#음악버튼.켜짐 .막대 i:nth-child(2){animation-delay:.18s}
#음악버튼.켜짐 .막대 i:nth-child(3){animation-delay:.36s}
#음악버튼.켜짐 .막대 i:nth-child(4){animation-delay:.1s}
@keyframes 출렁{0%,100%{height:5px}50%{height:17px}}
#음악버튼:focus-visible,a:focus-visible{outline:2px solid var(--주사밝음);outline-offset:4px}

/* ── 입장 화면 ── */
body.잠금{overflow:hidden}
#입장{
  position:fixed;inset:0;z-index:100;
  background:var(--먹);
  display:grid;place-items:center;
  transition:opacity 1.15s ease,visibility 1.15s;
}
#입장::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%, rgba(176,32,28,.10), transparent 62%);
}
#입장.나감{opacity:0;visibility:hidden;pointer-events:none}
.입장속{position:relative;text-align:center;padding:0 24px}
.입장한자{
  font-family:'Nanum Myeongjo',serif;font-weight:800;
  font-size:13px;letter-spacing:.66em;color:var(--한지흐림);
  margin-bottom:clamp(34px,6vh,58px);
  opacity:0;animation:떠오름 1.3s ease .3s forwards;
}
/* 찻잔 자리 */
.잔틀{
  position:relative;margin:0 auto;
  width:var(--잔크기);height:var(--잔크기);
  opacity:0;animation:떠오름 1.6s cubic-bezier(.16,1,.3,1) .6s forwards;
}
.잔그림{width:100%;height:100%;object-fit:contain;display:block;overflow:visible}
@keyframes 떠오름{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 김 */
.김{transform-origin:center;animation:김오름 7s ease-in-out infinite}
.김 path:nth-child(2){animation-delay:-2.3s}
.김 path:nth-child(3){animation-delay:-4.6s}
.김 path{animation:김흔들 7s ease-in-out infinite}
@keyframes 김오름{0%,100%{opacity:.16}50%{opacity:.3}}
@keyframes 김흔들{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

/* 꽃잎 */
#꽃잎{
  position:absolute;left:50%;top:50%;
  width:var(--잎크기);height:var(--잎크기);
  margin:calc(var(--잎크기) / -2) 0 0 calc(var(--잎크기) / -2);
  border:none;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;
  animation:꽃잎흔들 5.5s ease-in-out infinite;
  transition:filter .4s ease;
}
#꽃잎 img,#꽃잎 svg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#꽃잎:hover,#꽃잎:focus-visible{filter:drop-shadow(0 0 16px rgba(216,51,44,.7))}
#꽃잎:focus-visible{outline:none}
@keyframes 꽃잎흔들{
  0%,100%{transform:translate(0,0) rotate(-6deg)}
  50%{transform:translate(4px,-5px) rotate(5deg)}
}
#꽃잎.가라앉음{animation:가라앉기 1.15s cubic-bezier(.4,0,.6,1) forwards}
@keyframes 가라앉기{to{opacity:0;transform:translateY(11px) scale(.6) rotate(24deg)}}

/* 물결 */
.물결{
  position:absolute;left:50%;top:50%;width:20px;height:20px;
  margin:-10px 0 0 -10px;border-radius:50%;
  border:1px solid rgba(216,51,44,.55);opacity:0;pointer-events:none;
}
.물결:nth-of-type(2){border-color:rgba(230,220,203,.35)}
.물결:nth-of-type(3){border-color:rgba(216,51,44,.28)}
.물결.퍼짐{animation:퍼지기 1.6s cubic-bezier(.16,1,.3,1) forwards}
.물결.퍼짐:nth-of-type(2){animation-delay:.16s}
.물결.퍼짐:nth-of-type(3){animation-delay:.32s}
@keyframes 퍼지기{
  0%{opacity:.9;transform:scale(.3)}
  100%{opacity:0;transform:scale(9)}
}

.입장안내{
  margin-top:clamp(28px,5vh,44px);
  font-family:'Noto Sans KR',sans-serif;font-weight:300;
  font-size:11px;letter-spacing:.42em;color:var(--한지흐림);
  opacity:0;animation:안내깜빡 3.4s ease-in-out 1.6s infinite;
}
@keyframes 안내깜빡{0%,100%{opacity:.34}50%{opacity:.82}}

@media(max-width:640px){
  .입장한자{font-size:11px;letter-spacing:.5em}
  .입장안내{font-size:10px;letter-spacing:.3em}
}


@media(max-width:900px){
  section{padding:clamp(64px,9vh,96px) 0}
  .인물틀,.실험틀,.프롤틀{grid-template-columns:1fr;gap:38px}
  .인물틀 .그림{aspect-ratio:4/5;max-height:66svh}
  .실험틀 .그림,.프롤틀 .그림{aspect-ratio:16/10;order:2}
  .실험틀>div:first-child,.프롤틀>div:first-child{order:1}
}

/* ── 모바일 ── */
@media(max-width:640px){
  body{line-height:1.85}
  .벽{padding:0 22px}
  section{padding:62px 0}

  /* 표지: 이미지 위, 글 아래. 화면을 꽉 채우되 스크롤 부담 없게 */
  #표지{
    grid-template-columns:1fr;min-height:auto;gap:0;
    padding:0 0 54px;
  }
  #표지 .그림{height:58svh;order:-1;border:none;border-bottom:1px solid var(--선)}
  #표지 .그림::after{background:linear-gradient(to top,var(--먹) 0%,rgba(13,10,10,.35) 34%,transparent 62%)}
  #표지 .글{padding:0 22px;margin-top:-46px}
  .한자기둥{
    writing-mode:horizontal-tb;font-size:20px;letter-spacing:.52em;
    margin-bottom:12px;text-shadow:none;color:var(--한지흐림);
  }
  .이름크게{font-size:46px;margin-bottom:18px}
  .한줄{font-size:15px;max-width:none;margin-bottom:24px}
  .꼬리표{font-size:10px;letter-spacing:.3em;padding:8px 14px}
  .인장{width:58px;height:58px;font-size:23px;top:20px;right:20px;border-width:2px}
  .내려가기{display:none}

  /* 본문 */
  .제목{font-size:27px;letter-spacing:.1em}
  .눈썹{font-size:10px;letter-spacing:.42em;margin-bottom:14px}
  .본문{font-size:15px}
  .문서{padding:30px 22px}
  .문서::before,.문서::after{width:26px;height:26px}
  .붉은인{width:50px;height:50px;font-size:21px;right:20px;bottom:20px}

  /* 인물 */
  .인물틀 .그림{max-height:none;aspect-ratio:3/4}
  .항목 .줄{grid-template-columns:64px 1fr;gap:12px;padding:11px 0;font-size:14.5px}
  .항목 .키{font-size:10px;letter-spacing:.22em}
  .대사{font-size:14.5px}

  /* 실험: 세로쓰기는 좁은 화면에서 읽기 나쁘므로 가로로 */
  .단계 .칸{grid-template-columns:1fr;gap:7px;padding:19px 0}
  .단계 .칸:hover{padding-left:0}
  .단계 .이름{writing-mode:horizontal-tb;font-size:17px;letter-spacing:.16em;color:var(--주사밝음)}
  .단계 .설명{font-size:14.5px;padding-top:0}

  /* 지대 */
  .지대줄{grid-template-columns:40px 1fr;gap:16px;padding:17px 0}
  .지대줄:hover{padding-left:0}
  .급{font-size:25px}
  .지대이름{font-size:17px}
  .지대설명{font-size:13.5px}

  /* 프롤로그 */
  .지문{font-size:15px}
  .대사크게{font-size:19px;margin:26px 0;padding-left:18px}

  /* 시작 */
  #시작{padding:84px 0}
  .시작문구{font-size:25px;margin-bottom:34px}
  .버튼{padding:17px 30px;font-size:12px;letter-spacing:.26em}
  .바닥{margin-top:52px;letter-spacing:.28em}

  /* 음악 버튼: 홈 인디케이터 영역 피하기 */
  #음악버튼{
    right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:48px;height:48px;
  }
}

/* ── 아주 좁은 화면 ── */
@media(max-width:360px){
  .이름크게{font-size:40px}
  .벽{padding:0 18px}
  .항목 .줄{grid-template-columns:1fr;gap:2px}
  .항목 .키{padding-top:0}
}

/* ── 가로로 눕힌 휴대폰 ── */
@media(max-height:520px) and (orientation:landscape){
  #표지{grid-template-columns:1fr 1fr;padding:0 24px}
  #표지 .그림{height:88svh;order:0;border:1px solid var(--선)}
  #표지 .글{margin-top:0;padding:40px 0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .등장{opacity:1;transform:none}
  html{scroll-behavior:auto}
  .입장한자,.잔틀,.입장안내{opacity:1}
  #입장.나감{display:none}
}
</style>
</head>
<body class="잠금">

<div id="입장"></div>

<main id="담을곳"></main>

<button id="음악버튼" aria-label="배경음악 켜기">
  <span class="막대"><i></i><i></i><i></i><i></i></span>
</button>
<audio id="배경음악" loop preload="none"></audio>

<script>
const ㄱ = 설정;
const 그림 = (경로, 설명) => 경로
  ? `<img src="${경로}" alt="${설명}" loading="lazy">`
  : `<div class="빈자리">${설명}</div>`;

document.getElementById('담을곳').innerHTML = `

<section id="표지">
  <div class="인장">${ㄱ.의뢰.인장}</div>
  <div class="글">
    <div class="한자기둥">${ㄱ.표지.한자}</div>
    <h1 class="이름크게">${ㄱ.표지.이름.slice(0,1)}<span>${ㄱ.표지.이름.slice(1)}</span></h1>
    <p class="한줄">${ㄱ.표지.한줄}</p>
    <span class="꼬리표">${ㄱ.표지.꼬리표}</span>
  </div>
  <div class="그림">${그림(ㄱ.이미지.표지,'표지 이미지')}</div>
  <div class="내려가기">SCROLL</div>
</section>

<section id="의뢰">
  <div class="벽">
    <div class="문서 등장">
      <span class="눈썹">勅命</span>
      <h2 class="제목">${ㄱ.의뢰.제목}</h2>
      ${ㄱ.의뢰.본문.map(글=>`<p class="본문">${글}</p>`).join('')}
      <div class="붉은인">${ㄱ.의뢰.인장}</div>
    </div>
  </div>
</section>

<section id="인물">
  <div class="벽 인물틀">

    <div class="등장">
      <span class="눈썹">被驗者</span>
      <div class="이름줄">
        <h2 class="제목">${ㄱ.인물.이름}</h2>
        <span class="한자">${ㄱ.인물.한자}</span>
      </div>
      <div class="직함">${ㄱ.인물.직함}</div>
      <div class="항목">
        ${ㄱ.인물.항목.map(([ㅋ,ㅂ])=>`<div class="줄"><span class="키">${ㅋ}</span><span>${ㅂ}</span></div>`).join('')}
      </div>
      <p class="본문">${ㄱ.인물.본문}</p>
      <div class="대사모음">
        ${ㄱ.인물.대사.map(글=>`<p class="대사">"${글}"</p>`).join('')}
      </div>
    </div>
  </div>
</section>

<section id="실험">
  <div class="벽 실험틀">
    <div class="등장">
      <span class="눈썹">調製</span>
      <h2 class="제목">${ㄱ.실험.제목}</h2>
      <p class="본문" style="margin-top:22px">${ㄱ.실험.설명}</p>
      <div class="단계">
        ${ㄱ.실험.단계.map(([ㅇ,ㅅ])=>`
          <div class="칸"><div class="이름">${ㅇ}</div><div class="설명">${ㅅ}</div></div>`).join('')}
      </div>
    </div>
    <div class="그림 등장">${그림(ㄱ.이미지.분위기1,'분위기 이미지')}</div>
  </div>
</section>

<section id="지대">
  <div class="벽 등장">
    <span class="눈썹">危險地帶</span>
    <h2 class="제목">${ㄱ.지대.제목}</h2>
    <p class="본문" style="margin:20px 0 42px">${ㄱ.지대.설명}</p>
    ${ㄱ.지대.목록.map(([ㄷ,ㅇ,ㅅ])=>`
      <div class="지대줄">
        <div class="급">${ㄷ}<small>급</small></div>
        <div><div class="지대이름">${ㅇ}</div><div class="지대설명">${ㅅ}</div></div>
      </div>`).join('')}
  </div>
</section>

<section id="프롤로그">
  <div class="벽 프롤틀">
    <div class="등장">
      <span class="눈썹">序</span>
      <h2 class="제목" style="margin-bottom:30px">${ㄱ.프롤로그.제목}</h2>
      <p class="지문">${ㄱ.프롤로그.지문}</p>
      <p class="대사크게">"${ㄱ.프롤로그.대사}"</p>
      <p class="지문">${ㄱ.프롤로그.끝맺음}</p>
    </div>
    <div class="그림 등장">${그림(ㄱ.이미지.분위기2,'분위기 이미지')}</div>
  </div>
</section>

<section id="시작">
  <div class="벽 등장">
    <p class="시작문구">"${ㄱ.시작.문구}"</p>
    <a class="버튼" href="${ㄱ.시작.주소}"><span>${ㄱ.시작.버튼}</span></a>
    <div class="바닥">${ㄱ.표지.한자} ${ㄱ.인물.한자}</div>
  </div>
</section>
`;

/* 스크롤 등장 */
const 관찰자 = new IntersectionObserver((목록)=>{
  목록.forEach(ㄴ=>{ if(ㄴ.isIntersecting){ ㄴ.target.classList.add('보임'); 관찰자.unobserve(ㄴ.target); }});
},{threshold:.14,rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.등장').forEach(ㄴ=>관찰자.observe(ㄴ));

/* 배경음악 */
const 소리 = document.getElementById('배경음악');
const 버튼 = document.getElementById('음악버튼');
const 음악켜기 = () => {
  if(!ㄱ.음악) return;
  소리.volume = .45;
  소리.play().then(()=>{
    버튼.classList.add('켜짐');
    버튼.setAttribute('aria-label','배경음악 끄기');
  }).catch(()=>{});
};
if(ㄱ.음악){
  소리.src = ㄱ.음악;
  버튼.style.display = 'grid';
  버튼.addEventListener('click',()=>{
    if(소리.paused){ 음악켜기(); }
    else{
      소리.pause();
      버튼.classList.remove('켜짐');
      버튼.setAttribute('aria-label','배경음악 켜기');
    }
  });
}

/* 입장 화면 */
const 기본찻잔 = `
<svg class="잔그림" viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <radialGradient id="찻물" cx="50%" cy="42%" r="62%">
      <stop offset="0%"  stop-color="#3a2318"/>
      <stop offset="58%" stop-color="#1d120d"/>
      <stop offset="100%" stop-color="#0b0605"/>
    </radialGradient>
    <linearGradient id="잔살" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e6dccb" stop-opacity=".30"/>
      <stop offset="52%" stop-color="#e6dccb" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#e6dccb" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="106" rx="92" ry="92" fill="none" stroke="rgba(230,220,203,.07)" stroke-width="1"/>
  <ellipse cx="100" cy="104" rx="78" ry="78" fill="none" stroke="url(#잔살)" stroke-width="1.4"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#잔살)" stroke-width="2.6"/>
  <circle cx="100" cy="100" r="64" fill="none" stroke="rgba(230,220,203,.10)" stroke-width="1"/>
  <circle cx="100" cy="100" r="62" fill="url(#찻물)"/>
  <ellipse cx="82" cy="80" rx="26" ry="15" fill="rgba(230,220,203,.05)"/>
  <g class="김" stroke="rgba(230,220,203,.5)" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M84 46 q7-11 0-21 q-7-10 0-19"/>
    <path d="M100 40 q7-12 0-22 q-7-11 0-20"/>
    <path d="M116 46 q7-11 0-21 q-7-10 0-19"/>
  </g>
</svg>`;

const 기본꽃잎 = `
<svg viewBox="0 0 100 100" aria-hidden="true">
  <defs>
    <linearGradient id="잎빛" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8332c"/><stop offset="100%" stop-color="#7d1512"/>
    </linearGradient>
  </defs>
  <path d="M50 20 C74 30 82 52 70 70 C60 84 40 84 30 70 C18 52 26 30 50 20 Z" fill="url(#잎빛)"/>
  <path d="M50 24 C56 42 56 60 50 78" fill="none" stroke="rgba(13,10,10,.3)" stroke-width="1.6"/>
</svg>`;

document.getElementById('입장').innerHTML = `
<div class="입장속">
  <div class="입장한자">${ㄱ.입장.한자}</div>
  <div class="잔틀" style="--잔크기:min(${ㄱ.입장.잔크기}px, 78vw); --잎크기:min(${ㄱ.입장.잎크기}px, 20vw)">
    ${ㄱ.입장.찻잔 ? `<img class="잔그림" src="${ㄱ.입장.찻잔}" alt="">` : 기본찻잔}
    <span class="물결"></span><span class="물결"></span><span class="물결"></span>
    <button id="꽃잎" aria-label="들어가기">
      ${ㄱ.입장.꽃잎 ? `<img src="${ㄱ.입장.꽃잎}" alt="">` : 기본꽃잎}
    </button>
  </div>
  <div class="입장안내">${ㄱ.입장.안내}</div>
</div>`;

const 입장막 = document.getElementById('입장');
const 꽃잎 = document.getElementById('꽃잎');
let 들어갔나 = false;

function 들어가기(){
  if(들어갔나) return;
  들어갔나 = true;
  음악켜기();
  꽃잎.classList.add('가라앉음');
  입장막.querySelectorAll('.물결').forEach(ㅁ=>ㅁ.classList.add('퍼짐'));
  setTimeout(()=>{
    입장막.classList.add('나감');
    document.body.classList.remove('잠금');
  },1000);
}
꽃잎.addEventListener('click',들어가기);
</script>
